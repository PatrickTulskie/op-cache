[package]
name = "op-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A read-through, in-memory cache in front of the 1Password CLI"
license = "MIT"
repository = "https://github.com/PatrickTulskie/op-cache"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
console = "0.16.6"
humantime = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
strip = true
